name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - run: nix build .#osurx

      - uses: actions/upload-artifact@v4
        with:
          name: osu-rx-win-x64
          path: result/lib/osurx/
